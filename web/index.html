<!DOCTYPE html>
<html lang="zh-CN" data-version="v6-improved">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>组织搜索 - 中国 NGO 走出去数据平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: light dark; }
    html,body { margin:0; padding:0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "PingFang SC", "Noto Sans CJK", sans-serif; background:#fafafa; color:#111; }
    header { padding: 16px; background:#111827; color:#fff; }
    header .container { max-width: 1120px; margin:0 auto; padding:0 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    header h1 { margin:0; font-size:18px; }
    main { max-width:1120px; margin:0 auto; padding:16px; }
    .search-bar { display:grid; grid-template-columns: 1fr auto auto; gap:10px; }
    .search-input { padding:10px 12px; border:1px solid #e5e7eb; border-radius:10px; font-size:16px; }
    .clear-btn, .search-btn { padding:10px 12px; border:1px solid #e5e7eb; background:#fff; border-radius:10px; cursor:pointer; }
    .search-btn { border-color:#111827; background:#111827; color:#fff; }
    .org-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:16px; margin-top:16px; }
    .org-card { display:block; background:#fff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; text-decoration:none; color:inherit; transition:box-shadow .2s ease, transform .05s ease; }
    .org-card:hover { box-shadow:0 8px 24px rgba(0,0,0,.08); transform: translateY(-1px); }
    .logo-wrap { aspect-ratio: 3 / 2; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
    .logo-wrap::before { content:""; position:absolute; inset:0; background: conic-gradient(#f3f4f6 0 25%, #e5e7eb 0 50%) 0 0 / 18px 18px; }
    .logo-wrap img { position:relative; width:100%; height:100%; object-fit:contain; object-position:center; background:transparent; filter: drop-shadow(0 0 1px rgba(0,0,0,.25)); }
    .org-info { padding:10px 12px 12px; }
    .org-info h3 { margin:0 0 6px 0; font-size:16px; line-height:1.3; font-weight:600; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; }
    .tag { font-size:12px; padding:3px 6px; border-radius:999px; background:#eef2ff; color:#3730a3; }
    .pagination { margin: 16px 0; display:flex; gap:10px; align-items:center; justify-content:center; }
    .pagination button { padding:8px 12px; border:1px solid #e5e7eb; background:#fff; border-radius:10px; cursor:pointer; }
    .pagination button[disabled] { opacity:.5; cursor:not-allowed; }
    footer { padding:24px 16px; text-align:center; color:#6b7280; }
    @media (max-width: 480px) { .search-bar { grid-template-columns: 1fr; } header .container { flex-direction:column; align-items:flex-start; } }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="flex items-center gap-8">
        <h1 class="text-xl font-bold">NGO 数据平台</h1>
        <nav class="flex gap-6">
          <a href="./index.html" class="text-white font-medium border-b-2 border-blue-400">组织搜索</a>
          <a href="./policies.html" class="text-gray-300 hover:text-white transition-colors">政策搜索</a>
        </nav>
      </div>
    </div>
  </header>
  <main>
    <section aria-label="Search">
      <div class="search-bar">
        <input id="search-input" class="search-input" type="search" placeholder="搜索组织、地区、服务..." />
        <button id="clear-btn" class="clear-btn" type="button">清空</button>
        <button id="search-btn" class="search-btn" type="button">搜索</button>
      </div>
    </section>
    <section aria-label="Organization List">
      <div id="org-list-container"></div>
      <div id="pagination" class="pagination"></div>
    </section>
  </main>
  <footer><small>&copy; <span id="year"></span> NGO 目录</small></footer>

  <script>
    console.log("index.html version:", document.documentElement.dataset.version);
    document.getElementById("year").textContent = new Date().getFullYear();

    // Use relative paths - Service Binding via Pages Functions
    const API_BASE = "";

    // IMPORTANT: Update this to your deployed image proxy Worker URL
    // Deploy the image-proxy worker first: cd image-proxy && wrangler deploy
    // Then update this URL to match your deployed worker (e.g., https://ngo-img-proxy.your-subdomain.workers.dev)
    const IMG_PROXY = ""; // Leave empty to disable proxy temporarily

    const state = { query: "", page: 1, pageSize: 20, total: 0 };

    const PLACEHOLDER_LOGO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160"><rect width="100%" height="100%" fill="#f2f4f7"/><text x="50%" y="52%" font-family="system-ui,Arial" font-size="16" text-anchor="middle" fill="#98a2b3">No Logo</text></svg>'
    );

    function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function debounce(fn, wait){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), wait); }; }

    function driveToDirect(url) {
      if (!url) return null;
      const m = url.match(/\/d\/([^/]+)/) || url.match(/[?&]id=([^&]+)/);
      return m ? `https://drive.google.com/uc?export=view&id=${m[1]}` : url;
    }

    function throughProxy(src) {
      if (!src) return null;
      try {
        const u = new URL(src);
        if (IMG_PROXY) {
          const p = new URL(IMG_PROXY);
          p.searchParams.set("url", src);
          return p.toString();
        }
        return src;
      } catch {
        // Not a valid absolute URL, return as-is (data: etc.)
        return src;
      }
    }

    function normalizeLogoUrl(rawUrl) {
      const direct = driveToDirect((rawUrl || "").trim());
      if (!direct) return null;
      if (/^data:image\//i.test(direct)) return direct;
      if (/^https?:\/\//i.test(direct)) return throughProxy(direct);
      return null;
    }

    function makeLogoImg(rawUrl, altText = "logo") {
      const img = document.createElement("img");
      img.alt = altText;
      img.loading = "lazy";
      img.decoding = "async";
      img.referrerPolicy = "no-referrer";

      const finalSrc = normalizeLogoUrl(rawUrl) || PLACEHOLDER_LOGO;

      img.addEventListener("load", () => console.log("[logo loaded]", img.currentSrc));
      img.addEventListener("error", (e) => {
        console.warn("[logo error]", img.currentSrc, e);
        img.onerror = null;
        img.src = PLACEHOLDER_LOGO;
      });

      img.src = finalSrc;
      return img;
    }

    document.getElementById("search-btn").addEventListener("click", () => {
      state.query = document.getElementById("search-input").value.trim();
      state.page = 1; loadOrgs();
    });
    document.getElementById("clear-btn").addEventListener("click", () => {
      document.getElementById("search-input").value = "";
      state.query = ""; state.page = 1; loadOrgs();
    });
    document.getElementById("search-input").addEventListener("input", debounce((e) => {
      state.query = e.target.value.trim();
      state.page = 1; loadOrgs();
    }, 350));

    async function loadOrgs() {
      const params = new URLSearchParams();
      if (state.query) params.set("query", state.query);
      params.set("page", String(state.page));
      params.set("page_size", String(state.pageSize));
      const url = `${API_BASE}/api/orgs?${params.toString()}`;
      console.log("Fetching:", url);
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        const data = await res.json();
        state.total = Number(data.total || 0);
        renderOrgList(data.items || []);
        renderPagination();
      } catch (err) {
        console.error("Load failed:", err);
        renderError("加载失败");
      }
    }

    function renderError(msg) {
      document.getElementById("org-list-container").innerHTML = `<p>${escapeHtml(msg)}</p>`;
      document.getElementById("pagination").innerHTML = "";
    }

    function tag(text) {
      const span = document.createElement("span");
      span.className = "tag";
      span.textContent = text;
      return span;
    }

    function renderOrgList(items) {
      const container = document.getElementById("org-list-container");
      if (!items.length) { container.innerHTML = "<p>没有找到组织。</p>"; return; }

      const grid = document.createElement("div");
      grid.className = "org-grid";

      for (const org of items) {
        const card = document.createElement("a");
        card.className = "org-card";
        card.href = `./org.html?id=${encodeURIComponent(org.id)}`;
        card.setAttribute("aria-label", org.org_name || "organization");

        const logoWrap = document.createElement("div");
        logoWrap.className = "logo-wrap";
        logoWrap.appendChild(makeLogoImg(org.logo_url, `${org.org_name || ""} logo`));

        const info = document.createElement("div");
        info.className = "org-info";
        const h3 = document.createElement("h3");
        h3.textContent = org.org_name || "(未命名)";
        const tags = document.createElement("div");
        tags.className = "tags";
        if (org.go_out_level) tags.appendChild(tag(org.go_out_level));
        if (org.service_mode) tags.appendChild(tag(org.service_mode));
        if (org.overseas_regions) tags.appendChild(tag(String(org.overseas_regions).split(",")[0]));

        info.appendChild(h3);
        info.appendChild(tags);

        card.appendChild(logoWrap);
        card.appendChild(info);
        grid.appendChild(card);
      }

      container.innerHTML = "";
      container.appendChild(grid);
    }

    function renderPagination() {
      const totalPages = Math.max(1, Math.ceil(state.total / state.pageSize));
      const root = document.getElementById("pagination");
      root.innerHTML = `
        <button ${state.page <= 1 ? "disabled" : ""} id="prevPage">上一页</button>
        <span>第 ${state.page} / ${totalPages} 页</span>
        <button ${state.page >= totalPages ? "disabled" : ""} id="nextPage">下一页</button>
      `;
      document.getElementById("prevPage").onclick = () => { if (state.page > 1) { state.page -= 1; loadOrgs(); } };
      document.getElementById("nextPage").onclick = () => { if (state.page < totalPages) { state.page += 1; loadOrgs(); } };
    }

    loadOrgs();
  </script>
</body>
</html>
