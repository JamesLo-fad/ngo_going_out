<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>API Test</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .test { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
    .success { background: #d4edda; }
    .error { background: #f8d7da; }
    pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>API Test Results</h1>
  <div id="results"></div>

  <script>
    const tests = [
      { name: 'Test API', url: '/api/test' },
      { name: 'Orgs API', url: '/api/orgs?page=1&page_size=2' },
      { name: 'Policies API', url: '/api/policies?page=1&page_size=2' }
    ];

    async function runTests() {
      const resultsDiv = document.getElementById('results');

      for (const test of tests) {
        const testDiv = document.createElement('div');
        testDiv.className = 'test';
        testDiv.innerHTML = `<h3>${test.name}</h3><p>Testing ${test.url}...</p>`;
        resultsDiv.appendChild(testDiv);

        try {
          const response = await fetch(test.url);
          const data = await response.json();

          testDiv.className = 'test success';
          testDiv.innerHTML = `
            <h3>✓ ${test.name}</h3>
            <p>Status: ${response.status}</p>
            <pre>${JSON.stringify(data, null, 2).substring(0, 500)}</pre>
          `;
        } catch (error) {
          testDiv.className = 'test error';
          testDiv.innerHTML = `
            <h3>✗ ${test.name}</h3>
            <p>Error: ${error.message}</p>
          `;
        }
      }
    }

    runTests();
  </script>
</body>
</html>
