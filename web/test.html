<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>API 连接测试</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 20px; }
    .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
    .success { background: #d4edda; border-color: #c3e6cb; }
    .error { background: #f8d7da; border-color: #f5c6cb; }
    .pending { background: #fff3cd; border-color: #ffeaa7; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>🔍 API 连接诊断</h1>

  <button onclick="runTests()">运行测试</button>

  <div id="results"></div>

  <script>
    async function runTests() {
      const results = document.getElementById('results');
      results.innerHTML = '<div class="test pending">测试进行中...</div>';

      const tests = [];

      // Test 1: Health check
      tests.push({
        name: '健康检查 (/api/health)',
        url: '/api/health',
        check: (data) => data.ok === true
      });

      // Test 2: Orgs list
      tests.push({
        name: '组织列表 (/api/orgs)',
        url: '/api/orgs?page=1&page_size=5',
        check: (data) => data.total > 0 && Array.isArray(data.items)
      });

      // Test 3: Org detail
      tests.push({
        name: '组织详情 (/api/orgs/1)',
        url: '/api/orgs/1',
        check: (data) => data.id === 1 && data.org_name
      });

      // Test 4: Policies
      tests.push({
        name: '政策列表 (/api/policies)',
        url: '/api/policies?page=1&page_size=5',
        check: (data) => Array.isArray(data.items)
      });

      let html = '';

      for (const test of tests) {
        try {
          const startTime = Date.now();
          const response = await fetch(test.url);
          const duration = Date.now() - startTime;

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();
          const passed = test.check(data);

          html += `
            <div class="test ${passed ? 'success' : 'error'}">
              <h3>${passed ? '✅' : '❌'} ${test.name}</h3>
              <p>状态: ${response.status} ${response.statusText}</p>
              <p>耗时: ${duration}ms</p>
              <details>
                <summary>查看响应数据</summary>
                <pre>${JSON.stringify(data, null, 2)}</pre>
              </details>
            </div>
          `;
        } catch (error) {
          html += `
            <div class="test error">
              <h3>❌ ${test.name}</h3>
              <p>错误: ${error.message}</p>
              <p>URL: ${test.url}</p>
            </div>
          `;
        }
      }

      // Add environment info
      html += `
        <div class="test">
          <h3>📊 环境信息</h3>
          <p>当前 URL: ${location.href}</p>
          <p>Hostname: ${location.hostname}</p>
          <p>Protocol: ${location.protocol}</p>
          <p>User Agent: ${navigator.userAgent}</p>
        </div>
      `;

      results.innerHTML = html;
    }

    // Auto-run tests on load
    window.addEventListener('load', () => {
      setTimeout(runTests, 500);
    });
  </script>
</body>
</html>
