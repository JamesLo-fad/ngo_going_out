<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NGO Detail</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #fafafa; color: #111; }
    header { padding: 16px; background: #111827; color: #fff; }
    header .container { max-width: 960px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
    header a { color: #9ca3af; text-decoration: none; }
    main { max-width: 960px; margin: 16px auto; padding: 0 16px; }
    .org-hero { display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center; }
    .org-hero img { width: 140px; height: 140px; object-fit: contain; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; }
    .org-hero h1 { margin: 0; font-size: 28px; line-height: 1.2; }
    .org-sections { margin-top: 24px; display: grid; gap: 18px; }
    section h2 { margin: 0 0 8px 0; font-size: 18px; }
    .row { display: grid; grid-template-columns: 180px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #eee; }
    .label { color: #6b7280; }
    @media (max-width: 640px) {
      .org-hero { grid-template-columns: 1fr; text-align: center; }
      .org-hero img { margin: 0 auto; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="/index.html">← Back</a>
      <h1 style="margin:0;font-size:18px;">NGO Detail</h1>
    </div>
  </header>
  <main>
    <div id="org-detail">Loading...</div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const PLACEHOLDER_LOGO = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200"><rect width="100%" height="100%" fill="%23f0f0f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23999" font-family="Arial" font-size="20">No Logo</text></svg>';

    if (!id) {
      document.getElementById("org-detail").innerHTML = "<p>Missing id.</p>";
    } else {
      loadDetail(id);
    }

    async function loadDetail(id) {
      const res = await fetch(`/api/orgs/${encodeURIComponent(id)}`);
      if (!res.ok) {
        document.getElementById("org-detail").innerHTML = "<p>Organization not found.</p>";
        return;
      }
      const o = await res.json();
      renderDetail(o);
    }

    function renderDetail(o) {
      const logo = o.logo_url || PLACEHOLDER_LOGO;
      document.getElementById("org-detail").innerHTML = `
        <div class="org-hero">
          <img src="${logo}" alt="${escapeHtml(o.org_name)} logo" onerror="this.src='${PLACEHOLDER_LOGO}'" />
          <h1>${escapeHtml(o.org_name)}</h1>
        </div>
        <div class="org-sections">
          ${section("Basic Info", [
            row("Founded", o.founded_date),
            row("Registered Location", o.reg_location),
            row("Registration Type", o.reg_type),
            row("Capital Type", o.capital_type),
          ])}
          ${section("Overseas", [
            row("Go Out Level", o.go_out_level),
            row("Service Mode", o.service_mode),
            row("Overseas Regions", o.overseas_regions),
            row("Overseas Services", o.overseas_services),
            row("Overseas Projects", o.overseas_projects),
            row("Overseas Office", yesNo(o.has_overseas_office)),
          ])}
          ${section("People", [
            row("Leaders", o.leaders),
            row("Key Staff", o.key_staff),
            row("Official Background", yesNo(o.has_official_background)),
          ])}
          ${section("Donations", [
            row("Pre-go Global (amount)", o.donation_pre),
            row("Pre-go Global (year)", o.donation_pre_year),
            row("Post-go Global (amount)", o.donation_post),
          ])}
          ${section("Mission & Structure", [
            row("Mission", o.mission),
            row("Org Structure", o.org_structure),
            row("Overseas Mission", o.overseas_mission),
          ])}
          ${section("Transparency", [
            row("Disclosed Online", yesNo(o.disclosed_online)),
            row("Continuous Disclosure", yesNo(o.disclosed_continuous)),
            row("Sources", o.sources),
          ])}
        </div>
      `;
    }

    function section(title, rows) {
      const content = rows.filter(Boolean).join("");
      if (!content) return "";
      return `<section><h2>${escapeHtml(title)}</h2>${content}</section>`;
    }
    function row(label, value) {
      if (value === null || value === undefined || value === "") return "";
      return `<div class="row"><div class="label">${escapeHtml(label)}</div><div>${escapeHtml(String(value))}</div></div>`;
    }
    function yesNo(v) { return v === 1 ? "Yes" : v === 0 ? "No" : ""; }
    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
