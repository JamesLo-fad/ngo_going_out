<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Worker URL Test</title>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 800px; margin: 0 auto; }
    .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
    .url { font-family: monospace; background: #f5f5f5; padding: 4px 8px; border-radius: 4px; }
    .success { background: #d4edda; border-color: #c3e6cb; }
    .error { background: #f8d7da; border-color: #f5c6cb; }
    .pending { background: #fff3cd; border-color: #ffeaa7; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Worker URL 测试</h1>
  <p>测试不同的 Worker URL 以找到正确的访问地址</p>

  <div id="results"></div>

  <script>
    const urls = [
      'https://ngo-api.ngo-going-out.workers.dev/api/health',
      'https://ngo-api-dev.ngo-going-out.workers.dev/api/health',
      'https://ngo-api.6d141e69b8af7b758275bc89baebf95d.workers.dev/api/health',
      'https://ngo-api-dev.6d141e69b8af7b758275bc89baebf95d.workers.dev/api/health'
    ];

    const resultsDiv = document.getElementById('results');

    async function testUrl(url) {
      const testDiv = document.createElement('div');
      testDiv.className = 'test pending';
      testDiv.innerHTML = `
        <h3>测试: <span class="url">${url}</span></h3>
        <p>状态: 测试中...</p>
      `;
      resultsDiv.appendChild(testDiv);

      try {
        const startTime = Date.now();
        const response = await fetch(url, {
          cache: 'no-store',
          signal: AbortSignal.timeout(10000)
        });
        const duration = Date.now() - startTime;
        const data = await response.json();

        testDiv.className = 'test success';
        testDiv.innerHTML = `
          <h3>✅ 成功: <span class="url">${url}</span></h3>
          <p>状态码: ${response.status}</p>
          <p>响应时间: ${duration}ms</p>
          <p>响应数据:</p>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      } catch (error) {
        testDiv.className = 'test error';
        testDiv.innerHTML = `
          <h3>❌ 失败: <span class="url">${url}</span></h3>
          <p>错误: ${error.message}</p>
          <p>错误类型: ${error.name}</p>
        `;
      }
    }

    // Test all URLs
    (async () => {
      for (const url of urls) {
        await testUrl(url);
        await new Promise(resolve => setTimeout(resolve, 500));
      }
    })();
  </script>
</body>
</html>
