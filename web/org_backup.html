<!DOCTYPE html>
<html lang="zh-CN" data-version="v6-improved">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NGO 详情</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: light dark; }
    html,body { margin:0; padding:0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "PingFang SC", "Noto Sans CJK", sans-serif; background:#fafafa; color:#111; }
    header { padding:16px; background:#111827; color:#fff; }
    header .container { max-width:960px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:12px; }
    header a { color:#9ca3af; text-decoration:none; }
    main { max-width:960px; margin:16px auto; padding:0 16px; }
    .org-hero { display:grid; grid-template-columns: 160px 1fr; gap:16px; align-items:center; }
    .logo-outer { width:160px; height:160px; display:flex; align-items:center; justify-content:center; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; position:relative; background:#fff; }
    .logo-outer::before { content:""; position:absolute; inset:0; background: conic-gradient(#f3f4f6 0 25%, #e5e7eb 0 50%) 0 0 / 18px 18px; }
    .logo-outer img { position:relative; width:100%; height:100%; object-fit:contain; filter: drop-shadow(0 0 1px rgba(0,0,0,.25)); }
    .org-hero h1 { margin:0; font-size:26px; line-height:1.2; }
    .org-sections { margin-top:24px; display:grid; gap:18px; }
    section h2 { margin:0 0 8px 0; font-size:18px; }
    .row { display:grid; grid-template-columns: 180px 1fr; gap:10px; padding:8px 0; border-bottom:1px dashed #eee; }
    .label { color:#6b7280; }
    @media (max-width: 640px) {
      .org-hero { grid-template-columns: 1fr; text-align:center; }
      .logo-outer { margin: 0 auto; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav class="flex items-center gap-6">
        <a href="./index.html" class="text-gray-300 hover:text-white transition-colors">组织搜索</a>
        <a href="./policies.html" class="text-gray-300 hover:text-white transition-colors">政策搜索</a>
      </nav>
      <h1 style="margin:0;font-size:18px;">NGO 详情</h1>
    </div>
  </header>

  <main>
    <div id="org-detail">加载中...</div>
  </main>

  <script>
    console.log("org.html version:", document.documentElement.dataset.version);

    // Use relative paths - Service Binding via Pages Functions
    const API_BASE = "";

    // IMPORTANT: Update this to your deployed image proxy Worker URL
    // Deploy the image-proxy worker first: cd image-proxy && wrangler deploy
    // Then update this URL to match your deployed worker (e.g., https://ngo-img-proxy.your-subdomain.workers.dev)
    const IMG_PROXY = ""; // Leave empty to disable proxy temporarily

    const PLACEHOLDER_LOGO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200"><rect width="100%" height="100%" fill="#f2f4f7"/><text x="50%" y="52%" font-family="system-ui,Arial" font-size="20" text-anchor="middle" fill="#98a2b3">No Logo</text></svg>'
    );

    function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function yesNo(v){ return v === 1 ? "是" : v === 0 ? "否" : ""; }

    function driveToDirect(url) {
      if (!url) return null;
      const m = url.match(/\/d\/([^/]+)/) || url.match(/[?&]id=([^&]+)/);
      return m ? `https://drive.google.com/uc?export=view&id=${m[1]}` : url;
    }
    function throughProxy(src) {
      if (!src) return null;
      try {
        const u = new URL(src);
        const p = new URL(IMG_PROXY);
        p.searchParams.set("url", src);
        return p.toString();
      } catch { return src; }
    }
    function normalizeLogoUrl(rawUrl) {
      const direct = driveToDirect((rawUrl || "").trim());
      if (!direct) return null;
      if (/^data:image\//i.test(direct)) return direct;
      if (/^https?:\/\//i.test(direct)) return throughProxy(direct);
      return null;
    }

    function makeLogoImg(rawUrl, altText = "logo") {
      const img = document.createElement("img");
      img.alt = altText;
      img.loading = "lazy";
      img.decoding = "async";
      img.referrerPolicy = "no-referrer";

      const finalSrc = normalizeLogoUrl(rawUrl) || PLACEHOLDER_LOGO;

      img.addEventListener("load", () => console.log("[detail logo loaded]", img.currentSrc));
      img.addEventListener("error", (e) => { console.warn("[detail logo error]", img.currentSrc, e); img.onerror=null; img.src=PLACEHOLDER_LOGO; });

      img.src = finalSrc;
      return img;
    }

    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    if (!id) {
      document.getElementById("org-detail").innerHTML = "<p>缺少 id。</p>";
    } else {
      loadDetail(id);
    }

    async function loadDetail(id) {
      try {
        const res = await fetch(`${API_BASE}/api/orgs/${encodeURIComponent(id)}`, { cache: "no-store" });
        if (!res.ok) { document.getElementById("org-detail").innerHTML = "<p>未找到该组织。</p>"; return; }
        const o = await res.json();
        renderDetail(o);
      } catch (err) {
        console.error(err);
        document.getElementById("org-detail").innerHTML = "<p>加载失败。</p>";
      }
    }

    function section(title, rows) {
      const content = rows.filter(Boolean).join("");
      if (!content) return "";
      return `<section><h2>${escapeHtml(title)}</h2>${content}</section>`;
    }
    function row(label, value) {
      if (value === null || value === undefined || value === "") return "";
      return `<div class="row"><div class="label">${escapeHtml(label)}</div><div>${escapeHtml(String(value))}</div></div>`;
    }

    function renderDetail(o) {
      const container = document.getElementById("org-detail");
      container.innerHTML = "";

      const hero = document.createElement("div");
      hero.className = "org-hero";

      const logo = document.createElement("div");
      logo.className = "logo-outer";
      logo.appendChild(makeLogoImg(o.logo_url, `${o.org_name || ""} logo`));

      const title = document.createElement("h1");
      title.textContent = o.org_name || "(未命名)";

      hero.appendChild(logo);
      hero.appendChild(title);

      const sections = document.createElement("div");
      sections.className = "org-sections";
      sections.innerHTML = [
        section("基本信息", [
          row("注册地", o.reg_location),
          row("注册类型", o.reg_type),
          row("成立时间", o.founded_date),
        ]),
        section("海外", [
          row("走出去水平", o.go_out_level),
          row("服务模式", o.service_mode),
          row("地区", o.overseas_regions),
          row("项目", o.overseas_projects),
          row("是否有海外办公室", yesNo(o.has_overseas_office)),
        ]),
      ].filter(Boolean).join("");

      container.appendChild(hero);
      container.appendChild(sections);
    }
  </script>
</body>
</html>
