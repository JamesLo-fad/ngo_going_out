<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NGO 详情 - 中国 NGO 走出去数据平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Skeleton Loading Styles */
    .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s ease-in-out infinite; }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-box { background:#e5e7eb; border-radius:8px; }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      nav .flex.items-center.gap-8 { flex-direction:column; align-items:flex-start; gap:12px; }
      .bg-white.rounded-lg.shadow-lg.p-8 { padding:20px; }
      .bg-white.rounded-lg.shadow-lg.p-6 { padding:16px; }
    }
    @media (max-width: 480px) {
      main { padding:12px 16px; }
      .flex.items-start.gap-6 { flex-direction:column; gap:16px; }
      .w-32.h-32 { width:80px; height:80px; }
      .grid.grid-cols-1.md\\:grid-cols-2 { grid-template-columns:1fr; }
    }
  </style>
</head>
<body class="bg-gray-50">
  <!-- Navigation -->
  <nav class="bg-gray-900 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <div class="flex items-center gap-8">
        <a href="./index.html" class="text-xl font-bold hover:text-blue-400 transition-colors">NGO 数据平台</a>
        <div class="flex gap-6">
          <a href="./index.html" class="text-gray-300 hover:text-white transition-colors">组织搜索</a>
          <a href="./policies.html" class="text-gray-300 hover:text-white transition-colors">政策搜索</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- Breadcrumb -->
    <nav class="mb-6" aria-label="Breadcrumb">
      <ol class="flex items-center space-x-2 text-sm text-gray-600">
        <li>
          <a href="./index.html" class="hover:text-blue-600 transition-colors">组织搜索</a>
        </li>
        <li>
          <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
          </svg>
        </li>
        <li class="text-gray-900 font-medium" id="breadcrumb-org-name">组织详情</li>
      </ol>
    </nav>

    <div id="org-detail">
      <!-- Skeleton will be rendered here -->
    </div>
  </main>

  <script>
    const API_BASE = "";

    // Image proxy configuration (optional)
    // Temporarily disabled to test direct Google Drive access
    const IMG_PROXY = ""; // Leave empty to disable proxy

    // Placeholder logo for failed loads
    const PLACEHOLDER_LOGO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><rect width="100%" height="100%" fill="#f3f4f6"/><text x="50%" y="50%" font-family="Arial" font-size="14" text-anchor="middle" dy=".3em" fill="#9ca3af">No Logo</text></svg>'
    );

    // Convert Google Drive sharing links to direct image URLs
    function driveToDirect(url) {
      if (!url) return null;
      const m = url.match(/\/d\/([^/]+)/) || url.match(/[?&]id=([^&]+)/);
      // Use drive.usercontent.google.com instead of drive.google.com for better CORS support
      return m ? `https://drive.usercontent.google.com/download?id=${m[1]}&export=view` : url;
    }

    // Route image through proxy if configured
    function throughProxy(src) {
      if (!src) return null;
      try {
        const u = new URL(src);
        if (IMG_PROXY) {
          const p = new URL(IMG_PROXY);
          p.searchParams.set("url", src);
          return p.toString();
        }
        return src;
      } catch {
        return src;
      }
    }

    // Normalize logo URL (convert Drive links, apply proxy)
    function normalizeLogoUrl(rawUrl) {
      const direct = driveToDirect((rawUrl || "").trim());
      if (!direct) return null;
      if (/^data:image\//i.test(direct)) return direct;
      if (/^https?:\/\//i.test(direct)) return throughProxy(direct);
      return null;
    }

    // Render skeleton
    function renderSkeleton() {
      document.getElementById("org-detail").innerHTML = `
        <div class="bg-white rounded-lg shadow-lg p-8 mb-6">
          <div class="flex items-start gap-6">
            <div class="w-32 h-32 skeleton-box skeleton"></div>
            <div class="flex-1">
              <div class="h-8 w-3/4 skeleton-box skeleton mb-4"></div>
              <div class="h-4 w-1/4 skeleton-box skeleton"></div>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
          <div class="h-6 w-1/4 skeleton-box skeleton mb-4"></div>
          <div class="space-y-3">
            <div class="h-4 skeleton-box skeleton"></div>
            <div class="h-4 skeleton-box skeleton"></div>
            <div class="h-4 w-3/4 skeleton-box skeleton"></div>
          </div>
        </div>
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
          <div class="h-6 w-1/4 skeleton-box skeleton mb-4"></div>
          <div class="space-y-3">
            <div class="h-4 skeleton-box skeleton"></div>
            <div class="h-4 skeleton-box skeleton"></div>
          </div>
        </div>
      `;
    }

    // Helper functions
    function escapeHtml(s) {
      return (s || "").replace(/[&<>\"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // Convert 1/0 to 是/否
    function yesNo(v) {
      if (v === 1 || v === '1') return '<span class="inline-block bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-medium">是</span>';
      if (v === 0 || v === '0') return '<span class="inline-block bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-sm font-medium">否</span>';
      return '<span class="text-gray-400">-</span>';
    }

    // Handle null/empty values
    function displayValue(v) {
      if (v === null || v === undefined || v === '' || v === 'null') {
        return '<span class="text-gray-400">-</span>';
      }
      return escapeHtml(String(v));
    }

    // Get org ID from URL
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    if (!id) {
      document.getElementById("org-detail").innerHTML = '<div class="text-red-600">缺少组织 ID</div>';
    } else {
      renderSkeleton();
      loadDetail(id);
    }

    async function loadDetail(id) {
      try {
        const res = await fetch(`${API_BASE}/api/orgs/${encodeURIComponent(id)}`, { cache: "no-store" });
        if (!res.ok) {
          document.getElementById("org-detail").innerHTML = `
            <div class="text-center py-16">
              <svg class="mx-auto h-24 w-24 text-gray-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <h3 class="text-lg font-medium text-gray-900 mb-2">未找到该组织</h3>
              <p class="text-gray-500 mb-6">该组织可能已被删除或不存在</p>
              <a href="./index.html" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors">
                返回组织列表
              </a>
            </div>
          `;
          return;
        }
        const org = await res.json();
        // Update breadcrumb with org name
        document.getElementById("breadcrumb-org-name").textContent = org.org_name || "组织详情";
        renderDetail(org);
      } catch (err) {
        console.error(err);
        document.getElementById("org-detail").innerHTML = `
          <div class="text-center py-16">
            <svg class="mx-auto h-24 w-24 text-red-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <h3 class="text-lg font-medium text-gray-900 mb-2">加载失败</h3>
            <p class="text-gray-500 mb-6">请稍后重试</p>
            <button onclick="location.reload()" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors">
              <svg class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              重试
            </button>
          </div>
        `;
      }
    }

    function renderDetail(o) {
      const container = document.getElementById("org-detail");

      container.innerHTML = `
        <!-- Organization Header -->
        <div class="bg-white rounded-lg shadow-lg p-8 mb-6">
          <div class="flex items-start gap-6">
            <div class="flex-shrink-0">
              <img id="org-logo" src="${escapeHtml(normalizeLogoUrl(o.logo_url) || PLACEHOLDER_LOGO)}" alt="Logo" class="w-32 h-32 object-contain rounded-lg border border-gray-200" />
            </div>
            </div>
            <div class="flex-1">
              <h1 class="text-3xl font-bold text-gray-900 mb-2">${displayValue(o.org_name)}</h1>
              <div class="text-gray-600">编号：${displayValue(o.id)}</div>
            </div>
          </div>
        </div>

        <!-- Basic Information -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
          <h2 class="text-xl font-bold text-gray-900 mb-4 pb-2 border-b-2 border-blue-500">📋 基本信息</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex"><span class="font-medium text-gray-700 w-40">中促会：</span><span>${yesNo(o.in_cnie)}</span></div>
            <div class="flex"><span class="font-medium text-gray-700 w-40">民促会：</span><span>${yesNo(o.in_cace)}</span></div>
            <div class="flex"><span class="font-medium text-gray-700 w-40">联合国：</span><span>${yesNo(o.in_un)}</span></div>
            <div class="flex"><span class="font-medium text-gray-700 w-40">成立时间：</span><span>${displayValue(o.founded_date)}</span></div>
            <div class="flex"><span class="font-medium text-gray-700 w-40">出海时间：</span><span>${displayValue(o.go_global_date)}</span></div>
            <div class="flex"><span class="font-medium text-gray-700 w-40">领导人：</span><span>${displayValue(o.leaders)}</span></div>
            <div class="flex col-span-full"><span class="font-medium text-gray-700 w-40">重要员工：</span><span>${displayValue(o.key_staff)}</span></div>
          </div>
        </div>

        <!-- Registration Information -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
          <h2 class="text-xl font-bold text-gray-900 mb-4 pb-2 border-b-2 border-blue-500">🏛️ 注册信息</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex"><span class="font-medium text-gray-700 w-40">注册地：</span><span>${displayValue(o.reg_location)}</span></div>
            <div class="flex"><span class="font-medium text-gray-700 w-40">注册形式：</span><span>${displayValue(o.reg_type)}</span></div>
            <div class="flex col-span-full"><span class="font-medium text-gray-700 w-40">资本类型：</span><span>${displayValue(o.capital_type)}</span></div>
          </div>
        </div>

        <!-- Overseas Information -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
          <h2 class="text-xl font-bold text-gray-900 mb-4 pb-2 border-b-2 border-blue-500">🌍 海外信息</h2>
          <div class="space-y-3">
            <div class="flex"><span class="font-medium text-gray-700 w-48">是否有独立的海外办公室：</span><span>${yesNo(o.has_overseas_office)}</span></div>
            <div class="flex"><span class="font-medium text-gray-700 w-48">海外涉及的地区：</span><span>${displayValue(o.overseas_regions)}</span></div>
            <div class="flex"><span class="font-medium text-gray-700 w-48">海外项目的名称：</span><span>${displayValue(o.overseas_projects)}</span></div>
            <div class="flex"><span class="font-medium text-gray-700 w-48">海外服务内容：</span><span>${displayValue(o.overseas_services)}</span></div>
            <div class="flex"><span class="font-medium text-gray-700 w-48">服务形式：</span><span>${displayValue(o.service_mode)}</span></div>
            <div class="border-t pt-3 mt-3">
              <div class="font-medium text-gray-700 mb-2">官网关于海外项目的组织理念——目标：</div>
              <div class="text-gray-600 whitespace-pre-wrap">${displayValue(o.overseas_mission)}</div>
            </div>
          </div>
        </div>

        <!-- Disclosure Information -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
          <h2 class="text-xl font-bold text-gray-900 mb-4 pb-2 border-b-2 border-blue-500">📊 披露信息</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex"><span class="font-medium text-gray-700 w-40">是否有网上披露：</span><span>${yesNo(o.disclosed_online)}</span></div>
            <div class="flex"><span class="font-medium text-gray-700 w-40">是否持续性披露：</span><span>${yesNo(o.disclosed_continuous)}</span></div>
            <div class="flex"><span class="font-medium text-gray-700 w-40">走出去程度：</span><span>${displayValue(o.go_out_level)}</span></div>
            <div class="flex"><span class="font-medium text-gray-700 w-40">主要信息来源：</span><span>${displayValue(o.sources)}</span></div>
          </div>
        </div>

        <!-- Organization Mission -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
          <h2 class="text-xl font-bold text-gray-900 mb-4 pb-2 border-b-2 border-blue-500">🎯 组织理念</h2>
          <div class="text-gray-600 whitespace-pre-wrap">${displayValue(o.mission)}</div>
        </div>

        <!-- Organization Structure -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
          <h2 class="text-xl font-bold text-gray-900 mb-4 pb-2 border-b-2 border-blue-500">🏢 组织结构</h2>
          <div class="text-gray-600 whitespace-pre-wrap">${displayValue(o.org_structure)}</div>
        </div>

        <!-- Back Button -->
        <div class="text-center mt-8">
          <a href="./index.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg transition-colors font-medium">
            ← 返回组织列表
          </a>
        </div>
      `;

      // Handle logo loading errors
      const logoImg = document.getElementById('org-logo');
      if (logoImg) {
        logoImg.addEventListener('error', function() {
          console.warn('[logo error]', this.src);
          this.onerror = null; // Prevent infinite loop
          this.src = PLACEHOLDER_LOGO;
        });
        logoImg.addEventListener('load', function() {
          console.log('[logo loaded]', this.src);
        });
      }
    }
  </script>
</body>
</html>
